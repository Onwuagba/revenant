openapi: 3.0.3
info:
  title: Unsupported Demo API
  version: 1.0.0
  description: |
    Deliberately unsupported operations for the Buried report demo.
    Contains a nested object, a date-time, free text, and polymorphism.
servers:
  - url: http://localhost:8099
paths:
  /search:
    get:
      operationId: search_items
      summary: Search items
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /profile:
    post:
      operationId: create_profile
      summary: Create profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 20
                address:
                  type: object
                  properties:
                    street:
                      type: string
                    city:
                      type: string
                    country:
                      type: string
              required:
                - name
                - address
      responses:
        "201":
          description: Created
  /events:
    get:
      operationId: list_events
      summary: List events
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Events
  /variants:
    post:
      operationId: create_variant
      summary: Create variant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    type:
                      type: string
                      enum: ["A"]
                - type: object
                  properties:
                    type:
                      type: string
                      enum: ["B"]
      responses:
        "201":
          description: Created
  /upload:
    post:
      operationId: upload_file
      summary: Upload file
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Uploaded
