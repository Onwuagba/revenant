openapi: 3.0.3
info:
  title: Clinic Booking API
  version: 1.0.0
  description: Sample OpenAPI spec for the Revenant clinic booking USSD demo.
servers:
  - url: http://localhost:8090
paths:
  /clinics:
    get:
      operationId: list_clinics
      summary: List clinics
      responses:
        "200":
          description: List of clinics
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 8
                    name:
                      type: string
                      maxLength: 20
  /slots:
    get:
      operationId: list_slots
      summary: List time slots
      parameters:
        - name: clinic_id
          in: query
          required: true
          schema:
            type: string
            maxLength: 8
        - name: day
          in: query
          required: true
          schema:
            type: string
            format: date
            x-revenant-date-window: 5
      responses:
        "200":
          description: Available slots
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 8
                    label:
                      type: string
                      maxLength: 20
  /appointments:
    post:
      operationId: book_appointment
      summary: Book appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clinic_id:
                  type: string
                  maxLength: 8
                slot_id:
                  type: string
                  maxLength: 8
                pin:
                  type: string
                  x-revenant-secret: pin
                  minLength: 4
                  maxLength: 6
              required:
                - clinic_id
                - slot_id
                - pin
      responses:
        "201":
          description: Booking confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    maxLength: 8
                  time:
                    type: string
                    maxLength: 20
