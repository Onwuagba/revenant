[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revenant"
version = "0.1.0"
description = "Revenant: compile OpenAPI/MCP into verified USSD+SMS apps for feature phones."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0,<3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "openapi-spec-validator>=0.7",
]
mcp = [
    "mcp>=1.0",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["src"]
markers = [
    "pbt: property-based tests using Hypothesis",
    "integration: integration tests needing external services",
    "e2e: end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["revenant.compiler", "revenant.runtime"]
